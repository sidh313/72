<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسجد امام رضا (ع) | مدیریت هوشمند</title>
    
    <!-- جلوگیری از کش مرورگر -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <style>
        :root {
            --gold: #facc15;
            --gold-light: #fefce8;
            --bg-dark: #18181b;
            --card-bg: rgba(255, 255, 255, 0.08);
            --text: #e4e4e7;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #eab308;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', 'Tahoma', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #18181b 0%, #27272a 50%, #3f3f46 100%);
            min-height: 100vh;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            background: var(--gold);
            border-radius: 50%;
            animation: floatParticle 20s linear infinite;
            opacity: 0.4;
        }
        @keyframes floatParticle {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-100vh) rotate(360deg); }
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(250, 204, 21, 0.3);
            border-radius: 28px;
            padding: 24px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5), 0 0 0 1.5px rgba(250, 204, 21, 0.4) inset;
            animation: cardGlow 3s infinite alternate;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }
        @keyframes cardGlow {
            0% { box-shadow: 0 20px 45px rgba(0,0,0,0.6), 0 0 0 1.5px rgba(250,204,21,0.4) inset; }
            100% { box-shadow: 0 20px 45px rgba(0,0,0,0.6), 0 0 0 1.5px rgba(254,252,232,0.55) inset; }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            10%, 90% { transform: translateX(-2px); }
            30%, 70% { transform: translateX(4px); }
            50% { transform: translateX(-4px); }
        }

        input, select, textarea, button {
            font-family: inherit;
            font-size: 1rem;
            min-height: 48px;
            border-radius: 14px;
            border: 1.5px solid rgba(250, 204, 21, 0.3);
            background: rgba(10, 10, 18, 0.7);
            color: var(--text);
            padding: 0 14px;
            outline: none;
            transition: all 0.3s;
            width: 100%;
            margin: 6px 0;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--gold-light);
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.4);
        }
        button {
            background: linear-gradient(145deg, #1e1e2a, #0f0f18);
            border: 1.5px solid #a67c00;
            color: var(--gold-light);
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 20px;
            transition: all 0.3s;
        }
        button:hover {
            background: #2a2a38;
            border-color: var(--gold-light);
            box-shadow: 0 0 25px rgba(250, 204, 21, 0.5);
            transform: translateY(-2px);
        }
        button:active {
            transform: scale(0.96);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 12px 18px;
            border-radius: 30px;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .role-title {
            font-weight: 700;
            color: var(--gold-light);
            text-shadow: 0 0 12px rgba(250, 204, 21, 0.6);
            font-size: 1.1rem;
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
            justify-content: center;
        }
        .tab-btn {
            background: rgba(20, 20, 30, 0.7);
            border: 1px solid rgba(250, 204, 21, 0.4);
            padding: 10px 14px;
            border-radius: 30px;
            color: #ddd;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
            flex: 1 1 auto;
        }
        .tab-btn.active {
            background: #a67c00;
            color: #fff;
            border-color: var(--gold-light);
            box-shadow: 0 0 18px var(--gold-light);
        }

        .table-wrap {
            overflow-x: auto;
            border-radius: 18px;
            margin: 12px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 400px;
            background: rgba(0, 0, 0, 0.35);
        }
        th, td {
            padding: 10px 8px;
            text-align: center;
            border-bottom: 1px solid rgba(250, 204, 21, 0.2);
        }

        .attendance-select.present { background: #166534; color: #bbf7d0; border-color: #22c55e; }
        .attendance-select.excused { background: #5c4a1e; color: #fde68a; border-color: #eab308; }
        .attendance-select.absent { background: #5c1e1e; color: #fecaca; border-color: #ef4444; }

        .warning-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(180, 180, 190, 0.3);
            border: 1.5px solid #888;
            display: inline-block;
            margin: 0 3px;
            cursor: pointer;
            transition: 0.2s;
        }
        .warning-dot.filled {
            background: #ef4444;
            border-color: #fecaca;
            box-shadow: 0 0 10px #ef4444;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }
        .modal {
            background: var(--card-bg);
            backdrop-filter: blur(22px);
            border: 1.5px solid var(--gold);
            border-radius: 28px;
            padding: 22px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.8);
        }

        @media (max-width: 480px) {
            .glass-card { padding: 16px; }
            button { font-size: 0.9rem; padding: 10px; }
        }
    </style>
</head>
<body>

    <script>

            { title: 'مسئول سیستم صوتی', items: ['حفاظت از وسایل','نظم وسایل','نظافت وسایل','تحویل به موقع میکروفن','تنظیم پایه میکروفن','نظم سیم‌ها و گذاشتن آن‌ها زیر قالی','خاموش و روشن کردن به موقع سیستم صوتی','نظم کمد سیستم'] },

            { title: 'مسئول هیئت', items: ['نظم سینه‌زنان و وسایل','هماهنگی تدارکات','سیستم صوتی'] },
            { title: 'مسئول مکبری', items: ['به وقت رفتن مکبر','نداشتن غلط و تپق مکبر','پرت نشدن حواس مکبر'] },
            { title: 'مسئول آشپزخانه', items: ['حفاظت از وسایل','تحویل به موقع وسایل','نظافت وسایل','نظم وسایل','کنترل ورود و خروج','بوی بد ندادن اتاق','سطل زباله','جابه‌جا نشدن صندلی‌ها'] },
            { title: 'مسئول تدارکات', items: ['حفاظت از وسایل','نظم وسایل','نظافت وسایل','تحویل به موقع','کنترل ورود و خروج','بوی بد ندادن اتاق','کولر','نظم دمپایی و کفش‌ها','نظافت درون و برون زینبیه','نظافت پنجره‌های تدارکات'] },
            { title: 'مسئول هماهنگی', items: ['نظم در هماهنگی'] },

            { title: 'مسئول اتاق رسانه', items: ['نظافت اتاق','حفاظت از وسایل اتاق','قالی کردن سطل زباله','نظافت پنجره','منظم بودن وسایل','کولر','کنترل رفت و آمد','منظم بودن عکس‌ها','منظم بودن صندلی‌ها','منظم بودن کمد','بوی بد ندادن'] },

        const get = (key, def) => { try { const d = localStorage.getItem(key); return d ? JSON.parse(d) : def; } catch(e) { return def; } };
        const set = (key, val) => localStorage.setItem(key, JSON.stringify(val));

        let currentUser = null;
        let persons = get('persons', DEFAULT_PERSONS);
        let tasks = get('tasks', DEFAULT_TASKS);
        let warnings = get('warnings', {});
        let messages = get('messages', []);

        const app = document.getElementById('app');

        function getShamsiDate() {
            const now = new Date();
            const gy = now.getFullYear();
            const gm = now.getMonth() + 1;
            const gd = now.getDate();
            const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
            let jy = (gy <= 1600) ? 0 : 979;
            const gy2 = (gm <= 2) ? gy - 1 : gy;
            const days = (gy2 * 365) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) - 80 + gd + g_d_m[gm-1];
            const j_np = Math.floor(days / 12053);
            let days2 = days % 12053;
            jy += (33 * j_np) + (4 * Math.floor(days2 / 1461));
            days2 %= 1461;
            if (days2 >= 366) { jy += Math.floor((days2 - 1) / 365); days2 = (days2 - 1) % 365; }
            const jm = (days2 < 186) ? 1 + Math.floor(days2 / 31) : 7 + Math.floor((days2 - 186) / 30);
            const jd = (days2 < 186) ? 1 + (days2 % 31) : 1 + ((days2 - 186) % 30);
            const monthNames = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
            return { year: jy, month: jm, day: jd, monthName: monthNames[jm-1], full: `${jy}-${String(jm).padStart(2,'0')}-${String(jd).padStart(2,'0')}`, display: `${jd} ${monthNames[jm-1]}` };
        }

        function createParticles() {
            const container = document.getElementById('particlesContainer');
            for (let i = 0; i < 60; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.width = p.style.height = (3 + Math.random() * 5) + 'px';
                p.style.animationDuration = (15 + Math.random() * 20) + 's';
                container.appendChild(p);
            }
        }

        function renderLogin(step = 1, phone = '', error = '') {
            app.className = 'glass-card';
            app.style.maxWidth = '500px';
            app.innerHTML = `
                <h2 style="color:var(--gold-light); text-align:center; margin-bottom:20px;">🌟 ورود به سامانه مسجد</h2>
                ${step === 1 ? `
                    <div><label>📱 شماره تلفن</label><input type="tel" id="phoneInput" placeholder="شماره تلفن خود را وارد کنید" value="${phone}" autofocus>
                    <div style="color:var(--danger); font-size:0.9rem;">${error}</div>
                    <button id="loginStep1Btn" style="width:100%; margin-top:16px;">مرحله بعد</button></div>
                ` : `
                    <div><label>🔐 کد مسئولیت</label><input type="password" id="codeInput" maxlength="7" placeholder="کد ۷ رقمی" autofocus>
                    <div style="color:var(--danger); font-size:0.9rem;">${error}</div>
                    <button id="loginStep2Btn" style="width:100%; margin-top:16px;">ورود</button>
                    <button id="backToStep1Btn" style="width:100%; margin-top:8px; background:transparent;">بازگشت</button></div>
                `}`;

            if (step === 1) {
                document.getElementById('loginStep1Btn').addEventListener('click', () => {
                    const phone = document.getElementById('phoneInput').value.trim();
                    if (!USERS.find(u => u.phone === phone)) {
                        app.classList.add('shake'); setTimeout(() => app.classList.remove('shake'), 500);
                        renderLogin(1, phone, '⛔ شماره مجاز نیست'); return;
                    }
                    renderLogin(2, phone);
                });
                document.getElementById('phoneInput').addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('loginStep1Btn').click(); });
            } else {
                document.getElementById('loginStep2Btn').addEventListener('click', () => {
                    const code = document.getElementById('codeInput').value.trim();
                    const user = USERS.find(u => u.phone === phone && u.code === code);
                    if (!user) {
                        app.classList.add('shake'); setTimeout(() => app.classList.remove('shake'), 500);
                        renderLogin(2, phone, '⛔ کد اشتباه است'); return;
                    }
                    currentUser = user;
                    renderDashboard();
                });
                document.getElementById('backToStep1Btn').addEventListener('click', () => renderLogin(1, phone));
                document.getElementById('codeInput').addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('loginStep2Btn').click(); });
            }
        }

        function logout() { currentUser = null; renderLogin(1); }

        function sendMessageModal() {
            const overlay = document.createElement('div'); overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal"><h3 style="color:var(--gold-light); margin-bottom:12px;">📩 ارسال پیام به مدیریت</h3>
                <textarea id="msgText" rows="4" placeholder="پیام شما..."></textarea>
                <div style="display:flex; gap:10px; margin-top:14px;">
                    <button id="submitMsgBtn">ارسال</button><button id="cancelMsgBtn">انصراف</button></div></div>`;
            document.body.appendChild(overlay);
            document.getElementById('submitMsgBtn').addEventListener('click', () => {
                const text = document.getElementById('msgText')?.value.trim();
                if (!text) return;
                const now = getShamsiDate();
                messages.push({ from: currentUser.name, text, date: now.display });
                set('messages', messages);
                overlay.remove();
                alert('✅ پیام ارسال شد.');
            });
            document.getElementById('cancelMsgBtn').addEventListener('click', () => overlay.remove());
            overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
            document.getElementById('msgText').focus();
        }

        function renderDashboard() {
            if (!currentUser) return renderLogin(1);
            const role = currentUser.role;
            app.className = 'glass-card';
            app.style.maxWidth = '600px';
            app.style.padding = '18px';

                <div style="display:flex; gap:8px;"><button id="sendMsgTopBtn" title="ارسال پیام">📩</button><button id="logoutTopBtn" title="خروج">🚪</button></div></div>
                <div id="panelContent"></div>`;
            document.getElementById('sendMsgTopBtn').addEventListener('click', sendMessageModal);
            document.getElementById('logoutTopBtn').addEventListener('click', logout);
            const panel = document.getElementById('panelContent');
            if (role === 'attendance') renderAttendancePanel(panel);

            else if (role === 'owner') renderOwnerPanel(panel);

        function renderAttendancePanel(container) {
            const today = getShamsiDate();
            container.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;"><span style="color:var(--gold-light);">📅 امروز: ${today.display}</span></div>
                <div class="table-wrap"><table><thead><tr><th>نام</th><th>مغرب</th><th>عشا</th></tr></thead><tbody id="attendanceBody"></tbody></table></div>
                <button id="saveAttendanceBtn" style="width:100%; margin-top:14px;">💾 ذخیره وضعیت امروز</button>`;
            const tbody = document.getElementById('attendanceBody');
            persons.forEach(p => {
                tbody.innerHTML += `<tr><td>${p}</td>
                    <td><select class="attendance-select" data-person="${p}" data-prayer="maghreb"><option value="" selected>-- انتخاب --</option><option value="present">✅ حضور</option><option value="excused">🟡 موجه</option><option value="absent">❌ غیبت</option></select></td>
                    <td><select class="attendance-select" data-person="${p}" data-prayer="isha"><option value="" selected>-- انتخاب --</option><option value="present">✅ حضور</option><option value="excused">🟡 موجه</option><option value="absent">❌ غیبت</option></select></td></tr>`;
            });
            document.querySelectorAll('.attendance-select').forEach(sel => { sel.addEventListener('change', () => updateSelectColor(sel)); updateSelectColor(sel); });
            document.getElementById('saveAttendanceBtn').addEventListener('click', () => {
                const allAttendance = get('attendance', {});
                if (!allAttendance[today.full]) allAttendance[today.full] = {};
                document.querySelectorAll('.attendance-select').forEach(sel => {
                    const p = sel.dataset.person, pr = sel.dataset.prayer, v = sel.value;
                    if (!allAttendance[today.full][p]) allAttendance[today.full][p] = { maghreb: '', isha: '' };
                    allAttendance[today.full][p][pr] = v;
                });
                set('attendance', allAttendance);
                alert('✅ وضعیت امروز ذخیره شد.');
                const msg = `📊 گزارش حضور و غیاب ${today.display}:\n` + persons.map(p => { const d = allAttendance[today.full][p]; return `${p}: مغرب ${d.maghreb==='present'?'✅':d.maghreb==='excused'?'🟡':(d.maghreb==='absent'?'❌':'---')}، عشا ${d.isha==='present'?'✅':d.isha==='excused'?'🟡':(d.isha==='absent'?'❌':'---')}`; }).join('\n');
                messages.push({ from: 'سیستم حضور و غیاب', text: msg, date: today.display });
                set('messages', messages);
                renderAttendancePanel(container);
            });
        }

        function updateSelectColor(sel) { sel.classList.remove('present','excused','absent'); if (sel.value==='present') sel.classList.add('present'); else if (sel.value==='excused') sel.classList.add('excused'); else if (sel.value==='absent') sel.classList.add('absent'); }

        function renderSupervisorPanel(container) {
            container.innerHTML = '<div id="tasksContainer" style="display:flex; flex-direction:column; gap:16px;"></div>';
            const tc = document.getElementById('tasksContainer');
            tasks.forEach(task => {
                const card = document.createElement('div'); card.className = 'glass-card'; card.style.padding = '14px';
                card.innerHTML = `<h4 style="color:var(--gold-light); margin-bottom:8px;">${task.title}</h4><div>${task.items.map(item => { const key = `${task.title}|${item}`; const wa = warnings[key] || []; let dots = ''; for (let j=0; j<5; j++) dots += `<span class="warning-dot ${j<wa.length?'filled':''}" data-key="${key}" data-index="${j}"></span>`; return `<div style="display:flex; justify-content:space-between; margin:8px 0; align-items:center;"><span style="flex:1; font-size:0.9rem;">${item}</span><span>${dots}</span></div>`; }).join('')}</div>`;
                tc.appendChild(card);
            });
            document.querySelectorAll('.warning-dot').forEach(dot => { dot.addEventListener('click', function() { const key=this.dataset.key, idx=parseInt(this.dataset.index), wa=warnings[key]||[]; if (idx<wa.length) alert(`📅 تاریخ: ${wa[idx].date}\n📝 دلیل: ${wa[idx].reason}`); else if (idx===wa.length) showWarningModal(key); }); });
        }

        function showWarningModal(key) {
            const overlay = document.createElement('div'); overlay.className = 'modal-overlay';
            const months = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
            const cy = getShamsiDate().year;
            overlay.innerHTML = `<div class="modal"><h3 style="color:var(--gold-light); margin-bottom:12px;">⚠️ ثبت اخطار جدید</h3><div style="display:flex; gap:8px; margin-bottom:12px;"><select id="warnMonth">${months.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('')}</select><select id="warnDay">${Array.from({length:31},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('')}</select></div><textarea id="warnReason" placeholder="دلیل اخطار..."></textarea><div style="display:flex; gap:10px; margin-top:14px;"><button id="submitWarnBtn">ثبت</button><button id="cancelWarnBtn">انصراف</button></div></div>`;
            document.body.appendChild(overlay);
            document.getElementById('submitWarnBtn').addEventListener('click', () => {
                const month = document.getElementById('warnMonth')?.value, day = document.getElementById('warnDay')?.value, reason = document.getElementById('warnReason')?.value.trim();
                if (!month||!day||!reason) return alert('لطفاً تاریخ و دلیل را کامل کنید.');
                const mn = months[parseInt(month)-1], ds = `${day} ${mn}`, fds = `${cy}/${String(month).padStart(2,'0')}/${String(day).padStart(2,'0')}`;
                if (!warnings[key]) warnings[key] = []; if (warnings[key].length>=5) return alert('حداکثر ۵ اخطار مجاز است.');
                warnings[key].push({ date: ds, fullDate: fds }); set('warnings', warnings); overlay.remove(); renderDashboard();
            });
            document.getElementById('cancelWarnBtn').addEventListener('click', ()=>overlay.remove());
            overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
        }

        function renderOwnerPanel(container) {
            container.innerHTML = `<div class="tabs"><button class="tab-btn active" data-tab="reports">📊 گزارش حضور</button><button class="tab-btn" data-tab="messages">📩 پیام‌ها</button></div><div id="tabContent"></div>`;
            const tabs = container.querySelectorAll('.tab-btn'), tc = document.getElementById('tabContent');
            tabs.forEach(btn => { btn.addEventListener('click', function(){ tabs.forEach(b=>b.classList.remove('active')); this.classList.add('active'); if(this.dataset.tab==='reports') renderReportsTab(tc); else renderMessagesTab(tc); }); });
            renderReportsTab(tc);
        }

        function renderReportsTab(container) {
            container.innerHTML = `<h4 style="margin-bottom:10px;">📊 گزارش حضور و غیاب</h4><div id="datesList"></div><div id="reportTable" style="margin-top:12px;"></div>`;
            const allAttendance = get('attendance', {}), dp = /^\d{4}-\d{2}-\d{2}$/, dates = Object.keys(allAttendance).filter(k=>dp.test(k)).sort().reverse();
            const dl = document.getElementById('datesList');
            if (dates.length===0) { dl.innerHTML='<p>هیچ گزارشی ثبت نشده است.</p>'; return; }
            const mn = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
            dl.innerHTML = '<p>روزهای ثبت شده:</p><div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;">' + dates.map(date=>{ const [y,m,d]=date.split('-'); return `<button class="menu-btn date-report-btn" data-date="${date}">${d} ${mn[parseInt(m)-1]||''}</button>`; }).join('') + '</div>';
            document.querySelectorAll('.date-report-btn').forEach(btn=>{ btn.addEventListener('click', function(){ const date=this.dataset.date, dd=allAttendance[date], [y,m,d]=date.split('-'); let h=`<h5 style="margin-top:16px;">گزارش ${d} ${mn[parseInt(m)-1]||''}</h5><div class="table-wrap"><table><thead><tr><th>نام</th><th>مغرب</th><th>عشا</th></tr></thead><tbody>`; persons.forEach(p=>{ const r=dd[p]||{maghreb:'',isha:''}; h+=`<tr><td>${p}</td><td>${r.maghreb==='present'?'✅':r.maghreb==='excused'?'🟡':(r.maghreb==='absent'?'❌':'---')}</td><td>${r.isha==='present'?'✅':r.isha==='excused'?'🟡':(r.isha==='absent'?'❌':'---')}</td></tr>`; }); h+='</tbody></table></div>'; document.getElementById('reportTable').innerHTML=h; }); });
        }

        function renderMessagesTab(container) {
            container.innerHTML = `<h4 style="margin-bottom:10px;">📩 پیام‌های دریافتی</h4>`; if (messages.length===0) container.innerHTML+='<p>پیامی وجود ندارد.</p>';
            messages.forEach((m,i)=>{ container.innerHTML += `<div class="glass-card" style="padding:10px; margin:6px 0;">👤 ${m.from} | ${m.date}<br>${m.text}<button class="deleteMsgBtn" data-idx="${i}">🗑️</button></div>`; });
            document.querySelectorAll('.deleteMsgBtn').forEach(btn=>{ btn.addEventListener('click', function(){ const idx=parseInt(this.dataset.idx); messages.splice(idx,1); set('messages',messages); renderMessagesTab(container); }); });
        }

        createParticles();
        renderLogin(1);
    </script>
</body>
</html>
